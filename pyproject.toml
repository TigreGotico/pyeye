[project]
name = "pyeye-reasoner"
dynamic = ["version"]
description = "Pure-Python forward-chaining N3 reasoner (Euler Abstract Machine)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "rdflib>=6.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/pyeye"
Source = "https://github.com/TigreGotico/pyeye"
Issues = "https://github.com/TigreGotico/pyeye/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
pyeye = "pyeye.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyeye*"]

[tool.setuptools.dynamic]
version = {attr = "pyeye.version.__version__"}

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

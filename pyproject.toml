[project]
name = "pyeye"
version = "0.1.0"
description = "Pure-Python forward-chaining N3 reasoner (Euler Abstract Machine)"
requires-python = ">=3.11"
dependencies = [
    "rdflib>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
pyeye = "pyeye.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

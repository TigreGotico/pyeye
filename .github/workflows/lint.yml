name: Lint

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  lint:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@e37a97650feada694abb6420a84bbd23a71d6bb1
    secrets: inherit
    with:
      ruff: true
      pre_commit: false   # set true if .pre-commit-config.yaml exists
